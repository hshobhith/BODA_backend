# Production stack for a single VPS: API + Postgres + Redis behind Caddy (auto HTTPS).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# --env-file is required: Compose reads it both for ${...} substitution below and,
# via env_file, as the backend's runtime environment. See DEPLOY.md.
name: boda

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: .
    image: ${BACKEND_IMAGE:-boda-backend:latest}
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      # Ignored when DATABASE_URL is set (e.g. a managed database).
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Keep the V8 heap inside the container limit so Node GCs instead of being OOM-killed.
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private-uploads
    # Not published to the host: only Caddy reaches it on the internal network.
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env.production}
      TZ: Asia/Kolkata
    # Sized for a 2–4 GB VPS shared with the API and Redis.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ job data must never be silently dropped under memory pressure.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 128m
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  uploads:
  private_uploads:
  caddy_data:
  caddy_config:
