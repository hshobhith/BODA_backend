# Production stack for a single VPS: API + Redis behind Caddy (auto HTTPS).
#
# With a managed database (DATABASE_URL set in .env.production):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# With Postgres running on this server too, add the db file:
#   docker compose -f docker-compose.prod.yml -f docker-compose.db.yml --env-file .env.production up -d --build
#
# --env-file is required: Compose reads it both for ${...} substitution below and,
# via env_file, as the backend's runtime environment. See DEPLOY.md.
name: boda

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: .
    image: ${BACKEND_IMAGE:-boda-backend:latest}
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Keep the V8 heap inside the container limit so Node GCs instead of being OOM-killed.
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private-uploads
    # Not published to the host: only Caddy reaches it on the internal network.
    expose:
      - "4000"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ job data must never be silently dropped under memory pressure.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 128m
    logging: *logging

volumes:
  redis_data:
  uploads:
  private_uploads:
  caddy_data:
  caddy_config:
